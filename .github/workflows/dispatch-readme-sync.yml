name: Dispatch README synchronization

on:
  push:
    branches: [main]
    paths: [README.md]

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      TARGET_REPOSITORY: CoolLoong/coolloong.github.io
      TARGET_TOKEN: ${{ secrets.COOLLOONG_SITE_DISPATCH_TOKEN }}
    steps:
      - name: Dispatch source README update
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $TARGET_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$TARGET_REPOSITORY/dispatches" \
            --data '{"event_type":"source-readme-updated"}'
